name: pakka_homes
description: Pakka Homes Flutter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0
  # Image.network caches in memory only, so every cold start re-downloaded the
  # whole catalog. This caches to disk - see lib/widgets/remote_image.dart.
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/plumbing.png
    - assets/electrical.png
    - assets/cleaning.png
    - assets/painting.png
    - assets/waterproofing.png
    - assets/repair.png
    - assets/home/
    - assets/home/tiles/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/main icon/app_icon.png"
  # The cream disc the logo sits on, with the mark alone in the foreground.
  adaptive_icon_background: "#FDF4ED"
  adaptive_icon_foreground: "assets/main icon/app_icon_foreground.png"
  min_sdk_android: 21
